const modes=[['Дуэль снайперов',8,8,'RNSQKSNR'],['Осада',8,8,'TNBQKBNT'],['Гвардия',8,8,'RNGQKGNR'],['Наступление',8,8,'ZNBQKBNZ'],['Два новобранца',10,8,'RNBSQKGBNR'],['Бастион',10,10,'RNBSQKGZNT'],['Десант',8,8,'RNUQKUNR'],['Разведка',8,8,'RLBQKBLR'],['Диверсия',8,8,'HNBQKBNH'],['Воздушный бастион',10,10,'TLSUQKGHNZ']];
const O=[[1,0],[-1,0],[0,1],[0,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]],A=O.concat(D),N=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],V={P:100,N:310,B:340,R:520,Q:1000,K:0,S:550,T:480,G:510,Z:460,U:300,L:550,H:350};
function init(mode){let m=modes[mode],g={w:m[1],h:m[2],strong:mode===5||mode===9,noCastle:mode===9},b=Array(g.w*g.h).fill(null);for(let c=0;c<2;c++)for(let x=0;x<g.w;x++){b[(c?g.h-1:0)*g.w+x]={t:m[3][x],c,m:0};b[(c?g.h-2:1)*g.w+x]={t:'P',c,m:0};}return {b,g,turn:0,ep:null,half:0};}
function targets(s,i,atk=false){let {b,g}=s,p=b[i],x=i%g.w,y=Math.floor(i/g.w),sg=p.c?-1:1,out=[];

function check(s,c){let k=s.b.findIndex(p=>p&&p.t==='K'&&p.c===c);if(k<0)return true;for(let i=0;i<s.b.length;i++)if(s.b[i]&&s.b[i].c!==c&&targets(s,i,true).includes(k))return true;return false;}
function apply(s,m){let n={...s,b:s.b.map(p=>p?{...p}:null),ep:null,turn:1-s.turn,half:s.half+1},p=n.b[m.f],pawn=p.t==='P',capture=!!n.b[m.t];n.b[m.f]=null;p.m=1;if(m.castle){let r=n.b[m.t];n.b[m.t]=null;r.m=1;n.b[m.kt]=p;n.b[m.rt]=r;}else{if(pawn&&m.t===s.ep&&!n.b[m.t]&&m.f%s.g.w!==m.t%s.g.w)n.b[m.t+(p.c?s.g.w:-s.g.w)]=null;
if(pawn&&Math.abs(m.t-m.f)===2*s.g.w)n.ep=(m.f+m.t)/2;if(pawn&&[0,s.g.h-1].includes(Math.floor(m.t/s.g.w)))p.t=m.promo||'Q';n.b[m.t]=p;}if(pawn||capture)n.half=0;return n;}
function legal(s,c=s.turn){let {b,g}=s,ms=[];for(let i=0;i<b.length;i++){let p=b[i];if(!p||p.c!==c)continue;for(let j of targets(s,i)){if(b[j]?.t==='K')continue;let m={f:i,t:j};if(!check(apply(s,m),c))ms.push(m);}}
if(g.noCastle)return ms;let ki=b.findIndex(p=>p&&p.t==='K'&&p.c===c);if(ki<0||b[ki].m||check(s,c))return ms;let row=Math.floor(ki/g.w),kx=ki%g.w;
for(let x=0;x<g.w;x++){let ri=row*g.w+x,r=b[ri];if(!r||r.c!==c||r.m||!['R','T'].includes(r.t))continue;let right=x>kx,kd=right?g.w-2:g.w===8?2:1,rd=right?kd-1:kd+1,ok=true;for(let z=Math.min(kx,x,kd,rd);z<=Math.max(kx,x,kd,rd);z++)if(z!==kx&&z!==x&&b[row*g.w+z])ok=false;
for(let z=Math.min(kx,kd);ok&&z<=Math.max(kx,kd);z++){let n={...s,b:b.slice()};n.b[ki]=null;n.b[ri]=null;n.b[row*g.w+z]={...b[ki]};if(check(n,c))ok=false;}let m={f:ki,t:ri,castle:true,kt:row*g.w+kd,rt:row*g.w+rd};if(ok&&!check(apply(s,m),c))ms.push(m);}return ms;}
function evaluate(s,c){let v=0;for(let i=0;i<s.b.length;i++){let p=s.b[i];if(!p)continue;let y=Math.floor(i/s.g.w),a=p.c?s.g.h-1-y:y,z=V[p.t]+(p.t==='P'?a*a*2:0);v+=p.c===c?z:-z;}return v;}
let deadline;
function neg(s,d,alpha,beta,ply){if(Date.now()>deadline)throw 1;let ms=legal(s);if(!ms.length)return check(s,s.turn)?-100000+ply:0;if(!d)return evaluate(s,s.turn);ms.sort((a,z)=>(V[s.b[z.t]?.t]||0)-(V[s.b[a.t]?.t]||0));for(let m of ms){let v=-neg(apply(s,m),d-1,-beta,-alpha,ply+1);alpha=Math.max(alpha,v);if(alpha>=beta)break;}return alpha;}
function analyse(s,time=300,max=3){let scores=legal(s).map(m=>({m,v:evaluate(apply(s,m),s.turn)}));scores.sort((a,z)=>z.v-a.v);deadline=Date.now()+time;let depth=0;for(let d=1;d<=max;d++){let ns=[];try{for(let o of scores)ns.push({m:o.m,v:-neg(apply(s,o.m),d-1,-100001,100001,1)});ns.sort((a,z)=>z.v-a.v);scores=ns;depth=d;}catch(e){break;}}return {best:scores[0]?.m,scores,depth};}
function rate(a,m){let q=a.scores.find(o=>o.m.f===m.f&&o.m.t===m.t);if(!q||!a.depth)return null;let loss=a.scores[0].v-q.v;let t=q===a.scores[0]||loss<12?['Лучший','★','#349965']:loss<35?['Отличный','✓','#70a850']:loss<80?['Хороший','•','#879449']:loss<160?['Неточность','?!','#c59a28']:loss<300?['Ошибка','?','#db792c']:['Грубая ошибка','??','#d84949'];return {label:t[0],symbol:t[1],color:t[2]};}
function positionKey(s){return JSON.stringify([s.b.map(p=>p?[p.t,p.c,p.t==='P'||p.t==='K'||p.t==='R'||p.t==='T'?p.m:0]:null),s.turn,s.ep]);}
function ending(s,hist){if(!legal(s).length)return check(s,s.turn)?{text:s.turn?'Белые победили':'Чёрные победили',winner:1-s.turn}:{text:'Пат — ничья',winner:null};if(s.half>=100)return {text:'Ничья: 50 ходов',winner:null};let k=positionKey(s),n=hist.reduce((a,e)=>a+(positionKey(e.before)===k),1);if(n>=3)return {text:'Ничья: повторение',winner:null};return null;}

// Independent post-move analyser. Bot analyse() remains unchanged.
function analysisMoves(s){let out=[];for(let m of legal(s)){let p=s.b[m.f];if(p.t==='P'&&[0,s.g.h-1].includes(Math.floor(m.t/s.g.w))){for(let promo of ['Q','R','B','N'])out.push({...m,promo});}else out.push(m);}return out;}
function sameMove(a,b){return a.f===b.f&&a.t===b.t&&(a.promo||'Q')===(b.promo||'Q');}
function assess(s,played,time=1200,max=3){
 const stop=Date.now()+Math.max(30,time),TIMEOUT={},MATE=99000;let nodes=0;
 function tick(){nodes++;if(Date.now()>stop)throw TIMEOUT;}
 function order(ms,st){return ms.sort((a,b)=>((V[st.b[b.t]?.t]||0)+(b.promo?V[b.promo]:0))-((V[st.b[a.t]?.t]||0)+(a.promo?V[a.promo]:0)));}
 function search(st,d,alpha,beta,ply,qleft=3){tick();let moves=analysisMoves(st),inCheck=check(st,st.turn);if(!moves.length)return {v:inCheck?-100000+ply:0,pv:[]};if(st.half>=100)return {v:0,pv:[]};
 let best=-100001,line=[];
 if(d<=0){let stand=evaluate(st,st.turn);if(qleft<=0)return {v:stand,pv:[]};if(!inCheck){best=stand;if(best>=beta)return {v:best,pv:[]};alpha=Math.max(alpha,best);moves=moves.filter(m=>st.b[m.t]||m.promo||(st.b[m.f].t==='P'&&m.t===st.ep));if(!moves.length)return {v:best,pv:[]};}}
 for(let m of order(moves,st)){let r=search(apply(st,m),d-1,-beta,-alpha,ply+1,d<=0?qleft-1:qleft),v=-r.v;if(v>best){best=v;line=[m,...r.pv];}alpha=Math.max(alpha,v);if(alpha>=beta)break;}return {v:best,pv:line};}
 let roots=analysisMoves(s),completed=[],depth=0;if(!roots.some(m=>sameMove(m,played)))throw Error('Недопустимый ход для анализа');
 // All root moves are compared at an identical, fully completed depth.
 for(let d=1;d<=max;d++){let next=[];try{for(let m of roots){let r=search(apply(s,m),d-1,-100001,100001,1);next.push({m,v:-r.v,pv:[m,...r.pv]});}}catch(e){if(e!==TIMEOUT)throw e;break;}next.sort((a,b)=>b.v-a.v);completed=next;roots=next.map(o=>o.m);depth=d;}
 const direct=apply(s,played);if(!legal(direct).length&&check(direct,direct.turn))return {version:2,label:'Лучший',symbol:'★',color:'#349965',depth:Math.max(1,depth),confidence:'verified',loss:0,best:played,bestLine:[played],playedLine:[played],reason:'Поставлен мат. У соперника нет законного ответа.',nodes};
 let q=completed.find(o=>sameMove(o.m,played)),best=completed[0];if(!q||depth<2)return {version:2,label:'Предварительно',symbol:'≈',color:'#71849a',depth,confidence:'low',loss:null,best:best?.m||null,bestLine:best?.pv?.slice(0,6)||[],playedLine:q?.pv?.slice(0,6)||[],reason:depth?'Завершён только неглубокий поиск. Оценка качества хода не присвоена: нужен повторный анализ.':'Время анализа истекло до завершения общего сравнения. Оценка не присвоена.',nodes};
 let loss=Math.max(0,best.v-q.v),reason='',tier;
 if(best.v>MATE&&q.v>MATE){loss=0;tier=0;reason='И выбранный ход, и лучший вариант сохраняют найденный форсированный мат. Длина вариантов может отличаться.';}
 else if(best.v>MATE){tier=5;loss=null;reason='В лучшем варианте найден форсированный мат; после выбранного хода этот мат в пределах поиска не подтверждён.';}
 else if(q.v<-MATE&&best.v>=-MATE){tier=5;loss=null;reason='После выбранного хода найден форсированный мат вашему королю; в лучшем варианте на этой глубине мат не найден.';}
 else if(best.v<-MATE){tier=0;loss=0;reason='Во всех проверенных вариантах найден мат вашему королю. Ход не штрафуется за уже проигранную позицию.';}

</script><script>const OFFLINE_WORKER="\nconst modes=[['Дуэль снайперов',8,8,'RNSQKSNR'],['Осада',8,8,'TNBQKBNT'],['Гвардия',8,8,'RNGQKGNR'],['Наступление',8,8,'ZNBQKBNZ'],['Два новобранца',10,8,'RNBSQKGBNR'],['Бастион',10,10,'RNBSQKGZNT'],['Десант',8,8,'RNUQKUNR'],['Разведка',8,8,'RLBQKBLR'],['Диверсия',8,8,'HNBQKBNH'],['Воздушный бастион',10,10,'TLSUQKGHNZ']];\nconst O=[[1,0],[-1,0],[0,1],[0,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]],A=O.concat(D),N=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],V={P:100,N:310,B:340,R:520,Q:1000,K:0,S:550,T:480,G:510,Z:460,U:300,L:550,H:350};\nfunction init(mode){let m=modes[mode],g={w:m[1],h:m[2],strong:mode===5||mode===9,noCastle:mode===9},b=Array(g.w*g.h).fill(null);for(let c=0;c<2;c++)for(let x=0;x<g.w;x++){b[(c?g.h-1:0)*g.w+x]={t:m[3][x],c,m:0};b[(c?g.h-2:1)*g.w+x]={t:'P',c,m:0};}return {b,g,turn:0,ep:null,half:0};}\nfunction targets(s,i,atk=false){let {b,g}=s,p=b[i],x=i%g.w,y=Math.floor(i/g.w),sg=p.c?-1:1,out=[];\nfunction ray(ds,len,kind=0,start=1){for(let [dx,dy] of ds)for(let k=1;k<=len;k++){let xx=x+dx*k,yy=y+dy*k;if(xx<0||xx>=g.w||yy<0||yy>=g.h)break;let j=yy*g.w+xx,q=b[j];if(k>=start){if(atk){if(kind!==1)out.push(j);}else if(q?q.c!==p.c&&kind!==1:kind!==2)out.push(j);}if(q)break;}}\nswitch(p.t){case 'P':if(!atk)ray([[0,sg]],p.m?1:2,1);ray([[1,sg],[-1,sg]],1,2);if(!atk&&s.ep!==null&&Math.floor(s.ep/g.w)===y+sg&&Math.abs(s.ep%g.w-x)===1)out.push(s.ep);break;case 'N':ray(N,1);break;case 'U':ray(A.map(([x,y])=>[2*x,2*y]),1);break;case 'L':ray(N.concat(O.map(([x,y])=>[2*x,2*y])),1);break;case 'H':ray(D,1,1);ray(O.map(([x,y])=>[3*x,3*y]),1,2);break;case 'B':ray(D,20);break;case 'R':ray(O,20);break;case 'Q':ray(A,20);break;case 'K':ray(A,1);if(g.strong)ray([[0,1],[0,-1]],2,1,2);break;case 'S':ray(A,1,1);ray(A,20,2);break;case 'T':ray(O,20,1);ray(A,1,2);break;case 'G':ray(O,2);ray(D,3);break;case 'Z':ray([[0,sg],[1,0],[-1,0]],20);ray([[0,-sg]],1);break;}return out;}\nfunction check(s,c){let k=s.b.findIndex(p=>p&&p.t==='K'&&p.c===c);if(k<0)return true;for(let i=0;i<s.b.length;i++)if(s.b[i]&&s.b[i].c!==c&&targets(s,i,true).includes(k))return true;return false;}\nfunction apply(s,m){let n={...s,b:s.b.map(p=>p?{...p}:null),ep:null,turn:1-s.turn,half:s.half+1},p=n.b[m.f],pawn=p.t==='P',capture=!!n.b[m.t];n.b[m.f]=null;p.m=1;if(m.castle){let r=n.b[m.t];n.b[m.t]=null;r.m=1;n.b[m.kt]=p;n.b[m.rt]=r;}else{if(pawn&&m.t===s.ep&&!n.b[m.t]&&m.f%s.g.w!==m.t%s.g.w)n.b[m.t+(p.c?s.g.w:-s.g.w)]=null;\nif(pawn&&Math.abs(m.t-m.f)===2*s.g.w)n.ep=(m.f+m.t)/2;if(pawn&&[0,s.g.h-1].includes(Math.floor(m.t/s.g.w)))p.t=m.promo||'Q';n.b[m.t]=p;}if(pawn||capture)n.half=0;return n;}\nfunction legal(s,c=s.turn){let {b,g}=s,ms=[];for(let i=0;i<b.length;i++){let p=b[i];if(!p||p.c!==c)continue;for(let j of targets(s,i)){if(b[j]?.t==='K')continue;let m={f:i,t:j};if(!check(apply(s,m),c))ms.push(m);}}\nif(g.noCastle)return ms;let ki=b.findIndex(p=>p&&p.t==='K'&&p.c===c);if(ki<0||b[ki].m||check(s,c))return ms;let row=Math.floor(ki/g.w),kx=ki%g.w;\nfor(let x=0;x<g.w;x++){let ri=row*g.w+x,r=b[ri];if(!r||r.c!==c||r.m||!['R','T'].includes(r.t))continue;let right=x>kx,kd=right?g.w-2:g.w===8?2:1,rd=right?kd-1:kd+1,ok=true;for(let z=Math.min(kx,x,kd,rd);z<=Math.max(kx,x,kd,rd);z++)if(z!==kx&&z!==x&&b[row*g.w+z])ok=false;\nfor(let z=Math.min(kx,kd);ok&&z<=Math.max(kx,kd);z++){let n={...s,b:b.slice()};n.b[ki]=null;n.b[ri]=null;n.b[row*g.w+z]={...b[ki]};if(check(n,c))ok=false;}let m={f:ki,t:ri,castle:true,kt:row*g.w+kd,rt:row*g.w+rd};if(ok&&!check(apply(s,m),c))ms.push(m);}return ms;}\nfunction evaluate(s,c){let v=0;for(let i=0;i<s.b.length;i++){let p=s.b[i];if(!p)continue;let y=Math.floor(i/s.g.w),a=p.c?s.g.h-1-y:y,z=V[p.t]+(p.t==='P'?a*a*2:0);v+=p.c===c?z:-z;}return v;}\nlet deadline;\nfunction neg(s,d,alpha,beta,ply){if(Date.now()>deadline)throw 1;let ms=legal(s);if(!ms.length)return check(s,s.turn)?-100000+ply:0;if(!d)return evaluate(s,s.turn);ms.sort((a,z)=>(V[s.b[z.t]?.t]||0)-(V[s.b[a.t]?.t]||0));for(let m of ms){let v=-neg(apply(s,m),d-1,-beta,-alpha,ply+1);alpha=Math.max(alpha,v);if(alpha>=beta)break;}return alpha;}\nfunction analyse(s,time=300,max=3){let scores=legal(s).map(m=>({m,v:evaluate(apply(s,m),s.turn)}));scores.sort((a,z)=>z.v-a.v);deadline=Date.now()+time;let depth=0;for(let d=1;d<=max;d++){let ns=[];try{for(let o of scores)ns.push({m:o.m,v:-neg(apply(s,o.m),d-1,-100001,100001,1)});ns.sort((a,z)=>z.v-a.v);scores=ns;depth=d;}catch(e){break;}}return {best:scores[0]?.m,scores,depth};}\nfunction rate(a,m){let q=a.scores.find(o=>o.m.f===m.f&&o.m.t===m.t);if(!q||!a.depth)return null;let loss=a.scores[0].v-q.v;let t=q===a.scores[0]||loss<12?['Лучший','★','#349965']:loss<35?['Отличный','✓','#70a850']:loss<80?['Хороший','•','#879449']:loss<160?['Неточность','?!','#c59a28']:loss<300?['Ошибка','?','#db792c']:['Грубая ошибка','??','#d84949'];return {label:t[0],symbol:t[1],color:t[2]};}\nfunction positionKey(s){return JSON.stringify([s.b.map(p=>p?[p.t,p.c,p.t==='P'||p.t==='K'||p.t==='R'||p.t==='T'?p.m:0]:null),s.turn,s.ep]);}\nfunction ending(s,hist){if(!legal(s).length)return check(s,s.turn)?{text:s.turn?'Белые победили':'Чёрные победили',winner:1-s.turn}:{text:'Пат — ничья',winner:null};if(s.half>=100)return {text:'Ничья: 50 ходов',winner:null};let k=positionKey(s),n=hist.reduce((a,e)=>a+(positionKey(e.before)===k),1);if(n>=3)return {text:'Ничья: повторение',winner:null};return null;}\nif(typeof module!=='undefined')module.exports={modes,init,targets,check,apply,legal,analyse,rate,ending};\n\n// Independent post-move analyser. Bot analyse() remains unchanged.\nfunction analysisMoves(s){let out=[];for(let m of legal(s)){let p=s.b[m.f];if(p.t==='P'&&[0,s.g.h-1].includes(Math.floor(m.t/s.g.w))){for(let promo of ['Q','R','B','N'])out.push({...m,promo});}else out.push(m);}return out;}\nfunction sameMove(a,b){return a.f===b.f&&a.t===b.t&&(a.promo||'Q')===(b.promo||'Q');}\nfunction assess(s,played,time=1200,max=3){\n const stop=Date.now()+Math.max(30,time),TIMEOUT={},MATE=99000;let nodes=0;\n function tick(){nodes++;if(Date.now()>stop)throw TIMEOUT;}\n function order(ms,st){return ms.sort((a,b)=>((V[st.b[b.t]?.t]||0)+(b.promo?V[b.promo]:0))-((V[st.b[a.t]?.t]||0)+(a.promo?V[a.promo]:0)));}\n function search(st,d,alpha,beta,ply,qleft=3){tick();let moves=analysisMoves(st),inCheck=check(st,st.turn);if(!moves.length)return {v:inCheck?-100000+ply:0,pv:[]};if(st.half>=100)return {v:0,pv:[]};\n let best=-100001,line=[];\n if(d<=0){let stand=evaluate(st,st.turn);if(qleft<=0)return {v:stand,pv:[]};if(!inCheck){best=stand;if(best>=beta)return {v:best,pv:[]};alpha=Math.max(alpha,best);moves=moves.filter(m=>st.b[m.t]||m.promo||(st.b[m.f].t==='P'&&m.t===st.ep));if(!moves.length)return {v:best,pv:[]};}}\n for(let m of order(moves,st)){let r=search(apply(st,m),d-1,-beta,-alpha,ply+1,d<=0?qleft-1:qleft),v=-r.v;if(v>best){best=v;line=[m,...r.pv];}alpha=Math.max(alpha,v);if(alpha>=beta)break;}return {v:best,pv:line};}\n let roots=analysisMoves(s),completed=[],depth=0;if(!roots.some(m=>sameMove(m,played)))throw Error('Недопустимый ход для анализа');\n // All root moves are compared at an identical, fully completed depth.\n for(let d=1;d<=max;d++){let next=[];try{for(let m of roots){let r=search(apply(s,m),d-1,-100001,100001,1);next.push({m,v:-r.v,pv:[m,...r.pv]});}}catch(e){if(e!==TIMEOUT)throw e;break;}next.sort((a,b)=>b.v-a.v);completed=next;roots=next.map(o=>o.m);depth=d;}\n const direct=apply(s,played);if(!legal(direct).length&&check(direct,direct.turn))return {version:2,label:'Лучший',symbol:'★',color:'#349965',depth:Math.max(1,depth),confidence:'verified',loss:0,best:played,bestLine:[played],playedLine:[played],reason:'Поставлен мат. У соперника нет законного ответа.',nodes};\n let q=completed.find(o=>sameMove(o.m,played)),best=completed[0];if(!q||depth<2)return {version:2,label:'Предварительно',symbol:'≈',color:'#71849a',depth,confidence:'low',loss:null,best:best?.m||null,bestLine:best?.pv?.slice(0,6)||[],playedLine:q?.pv?.slice(0,6)||[],reason:depth?'Завершён тол function offlineWork(s,m,kind='rate'){return new Promise((resolve)=>{let w,url,timer,finished=false;function fallback(){if(finished)return;finished=true;if(timer)clearTimeout(timer);if(w)w.terminate();if(url)URL.revokeObjectURL(url);setTimeout(()=>{try{resolve(kind==='best'?analyse(s,250,2):assess(s,m,250,2));}catch(e){resolve(kind==='best'?{best:legal(s)[0]}:{version:2,label:'Без оценки',symbol:'—',color:'#71849a',reason:'Не удалось выполнить анализ.'});}},10);}try{url=URL.createObjectURL(new Blob([OFFLINE_WORKER],{type:'text/javascript'}));w=new Worker(url);w.onmessage=e=>{if(e.data.error){fallback();return;}if(finished)return;finished=true;clearTimeout(timer);w.terminate();URL.revokeObjectURL(url);resolve(e.data.result);};w.onerror=fallback;timer=setTimeout(fallback,4500);w.postMessage({s,m,kind});}catch(e){fallback();}});}

function ratingInfo(r,s){if(!r)return '<p class="small">Оценки нет.</p>';function coord(i){return String.fromCharCode(97+i%s.g.w)+(Math.floor(i/s.g.w)+1);}function line(ms){return (ms||[]).map(m=>coord(m.f)+' → '+coord(m.castle?m.kt:m.t)+(m.promo?'='+m.promo:'')).join(' · ');}return '<div class="analysis-info">'+badge(r)+' '+r.label+'<p>'+ (r.reason||'Старая оценка. Нажмите «Переоценить ход» для нового анализа.')+'</p><p class="small">'+(r.version===2?'Глубина: '+r.depth+' полухода + тактические продолжения. ':'Оценка предыдущей версии. ')+(r.loss!==null&&r.loss!==undefined?'Разница: '+(r.loss/100).toFixed(2)+' условной пешки.':'')+'</p>'+(r.bestLine?.length?'<p>Лучший найденный вариант: '+line(r.bestLine)+'</p>':'')+(r.playedLine?.length?'<p>Выбранный ход и ответ: '+line(r.playedLine)+'</p>':'')+'</div>';}
